services:
  twenty-tickets:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:?Set RESEND_WEBHOOK_SECRET}
      TWENTY_BASE_URL: ${TWENTY_BASE_URL:-}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
    volumes:
      - inbox:/data
    stop_grace_period: 25s

volumes:
  inbox:
